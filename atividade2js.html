                if ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['operacao'])) {
                    $a = floatval($_POST['num1']);
                    $b = floatval($_POST['num2']);
                    $op = $_POST['operacao'];

                    switch ($op) {
                        case '+': $c = $a + $b; break;
                        case '−': $c = $a - $b; break;
                        case '×': $c = $a * $b; break;
                        case '÷':
                            if ($b == 0) {
                                echo '<div class="result-box" style="border-left-color:#DC143C;">⚠️ Divisão por zero não é permitida.</div>';
                                break;
                            }
                            $c = $a / $b;
                            break;
                    }

                    if (isset($c)) {
                        echo "<div class='result-box'>Resultado: <strong>{$a} {$op} {$b} = {$c}</strong></div>";
                    }
                }
            ?>

    <script>
        function horario() {
            const hoje = new Date();
            const h = String(hoje.getHours()).padStart(2, '0');
            const m = String(hoje.getMinutes()).padStart(2, '0');
            const s = String(hoje.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}:${s}`;
        }
        setInterval(horario, 1000);
        horario();
    </script>
