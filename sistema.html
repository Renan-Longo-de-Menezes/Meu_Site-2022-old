<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro</title>
    <link rel="shortcut icon" href="img/estrela.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/estilos-exercicios.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="ex-header">
        <h1>Sistema de Cadastro</h1>
        <p>Login e autenticação</p>
    </header>

    <main class="ex-main">
        <div class="ex-card login-card">
            <div class="login-icon">🔐</div>
            <h2>Bem-vindo</h2>
            <p class="subtitle">Faça login para acessar o sistema</p>

            <form action="php/logar.php" method="post" enctype="multipart/form-data" name="formlogin" class="ex-form">
                <div class="form-group">
                    <label for="login">Login</label>
                    <input type="text" id="login" name="login" maxlength="200" placeholder="Seu usuário" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" maxlength="15" placeholder="Sua senha" required>
                </div>

                <div class="form-actions">
                    <input type="submit" name="logar" value="LOGAR" class="btn btn-primary">
                </div>

                <div class="login-links">
                    <a href="php/cadastro2.php" class="login-link">Cadastre-se</a>
                    <span class="login-separator">•</span>
                    <a href="php/lembrar_senha.php" class="login-link">Esqueceu a senha?</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="ex-footer">
        <p>Desenvolvido por <strong>Renan Longo de Menezes</strong> — Nº24 — 2EMCC</p>
    </footer>
