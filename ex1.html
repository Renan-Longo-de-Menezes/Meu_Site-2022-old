	<script type="text/javascript">
	function horario(){
		hoje = new Date();

		hora = hoje.getHours();
		if (hora < 10)
			hora = "0" + hora;

		minutos = hoje.getMinutes();
		if (minutos < 10)
			minutos = "0" + minutos;

		segundos = hoje.getSeconds();
		if (segundos < 10)
			segundos = "0" + segundos;

		document.form1.horaatual.value = hora+":"+minutos+":"+segundos;

	}
window.setInterval("horario()", 1000);
</script>
